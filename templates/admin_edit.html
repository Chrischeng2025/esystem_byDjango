{% extends "layout.html" %}

{% block content %}
    <div class="container mt-5">
        <h1 class="mb-4">修改账号信息</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                {% for field in form %}
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    <p style="color: red">{{ field.errors.0 }}</p>
                {% endfor %}
            </div>

            <button type="submit" class="btn btn-primary">提交</button>
        </form>
    </div>

{% endblock %}
