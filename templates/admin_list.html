{% extends "layout.html" %}

{% block content %}
    <div class="container mt-4">
        <h1 class="mb-4">管理员列表</h1>

        <!-- 新建管理员账号按钮 -->
        <div style="margin-bottom:18px" class="clearfix">
            <a href="/admin/add/" class="btn btn-success mb-3">新增管理员</a>
            

            <div class="mb-3" style="float:right;width:200px">
                <form method="get">
                    <div class="input-group">
                        <input type="text" class="form-control" name="q" placeholder="搜索"
                               value="{{ search_data }}">
                        <button type="submit" class="btn btn-primary">搜索</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- 搜索框 -->

        <!-- 管理员账号列表表格 -->
        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>账号</th>
                <th>密码</th>
                <th>级别</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            {% for obj in queryset %}
                <tr>
                    <td>{{ obj.id }}</td>
                    <td>{{ obj.username }}</td>
                    <td>********</td>
                    <td>{{ obj.get_level_display }}</td>
                    <td>
                        <a href="/admin/{{ obj.id }}/edit/" class="btn btn-sm btn-warning">编辑</a>
                        <a href="/admin/{{ obj.id }}/delete/" class="btn btn-sm btn-danger">删除</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
