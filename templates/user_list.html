{% extends "layout.html" %}

{% block content %}
    <div class="container mt-4">
        <h1 class="mb-4">员工列表</h1>

        <!-- 新建员工按钮 -->
        <a href="/user/add/" class="btn btn-success mb-3">新增员工</a>
        <!-- 员工列表表格 -->
        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>性别</th>
                <th>年龄</th>
                <th>薪资</th>
                <th>入职时间</th>
                <th>部门</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <!-- 这里应该使用后端数据循环生成实际的部门列表 -->
            {% for obj in queryset %}
                <tr>
                    <td>{{ obj.id }}</td>
                    <td>{{ obj.name }}</td>
                    <td>{{ obj.get_gender_display }}</td>
                    <td>{{ obj.age }}</td>
                    <td>{{ obj.account }}</td>
                    <td>{{ obj.create_time|date:"Y-m-d"}}</td>
                    <td>{{ obj.depart.title }}</td>
                    <td>
                        <a href="/user/{{ obj.id }}/edit/" class="btn btn-sm btn-warning">编辑</a>
                        <a href="/user/{{ obj.id }}/delete/" class="btn btn-sm btn-danger">删除</a>
                    </td>
                </tr>
            {% endfor %}
            <!-- 更多部门... -->
            </tbody>
        </table>
    </div>
{% endblock %}
