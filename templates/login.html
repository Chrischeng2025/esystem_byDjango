<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 员工管理系统</title>
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
            padding: 15px;
            margin-top: 100px;
        }

        .login-form h2 {
            margin-bottom: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-form">
        <h2>员工管理系统</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {% for field in form %}
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    <p style="color: red">{{ field.errors.0 }}</p>
                {% endfor %}
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">记住我</label>
            </div>
            <div class="container mt-5">
                <div class="mb-3">
                    <label for="captcha" class="form-label">请输入验证码</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="captcha" name="captcha" required>
                        <img src="/image/code/" alt="验证码" class="img-thumbnail" style="height: 40px;">
                    </div>
                    <div class="form-text">请输入图片中的验证码</div>
                </div>

                <button type="submit" class="btn btn-primary">提交</button>


        </form>
        <div class="mt-3 text-center">
            <a href="#" class="text-decoration-none">忘记密码?</a>
        </div>
    </div>
</div>

<!-- 引入Bootstrap JS 和 Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
